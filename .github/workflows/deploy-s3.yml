name: Build and Deploy Nuxt to Linode S3

on:
  push:
    branches:
      - main # Change to your production branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Deploy to Linode Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1 # Required by AWS CLI, can stay default
        run: |
          aws s3 sync .output/public s3://${{ secrets.LINODE_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.LINODE_CLUSTER_ID }}.linodeobjects.com \
            --acl public-read \
            --delete
